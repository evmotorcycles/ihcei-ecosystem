[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "prox-layer"
version = "1.0.0"
description = "A proximity layer for everything — training-free metric geometry over any collection, on CPU"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
keywords = ["search", "retrieval", "effective-resistance", "graph", "embedding", "offline"]
dependencies = ["numpy>=1.21", "scipy>=1.8"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
prox = "prox.cli:main"

[tool.setuptools.packages.find]
include = ["prox*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
